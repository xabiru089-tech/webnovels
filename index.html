<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Reader</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📚 Novel Library</h1>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Cari novel...">
                <button onclick="searchNovels()">🔍</button>
            </div>
        </header>

        <div class="genre-filter">
            <button class="genre-btn active" onclick="filterByGenre('all')">Semua</button>
            <button class="genre-btn" onclick="filterByGenre('romance')">Romance</button>
            <button class="genre-btn" onclick="filterByGenre('harem')">Harem</button>
            <button class="genre-btn" onclick="filterByGenre('fantasy')">Fantasy</button>
            <button class="genre-btn" onclick="filterByGenre('action')">Action</button>
            <button class="genre-btn" onclick="filterByGenre('mystery')">Mystery</button>
        </div>

        <div id="novelGrid" class="novel-grid"></div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
      </html>
